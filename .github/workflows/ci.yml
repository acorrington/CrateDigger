name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds the net8.0 targets and understands the .slnx format.
          # With no lib/*.dll present, CrateDigger.Plugin compiles against the
          # EmbyStubs project (CI never sees Emby's proprietary assemblies).
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CrateDigger.slnx

      - name: Build (Release)
        run: dotnet build CrateDigger.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/CrateDigger.Core.Tests/CrateDigger.Core.Tests.csproj
          -c Release --no-build
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14